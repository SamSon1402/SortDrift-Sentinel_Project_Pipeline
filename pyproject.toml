[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-drift-sentinel"
version = "0.2.0"
description = "Industrial CV reliability, drift and release-control service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
yc = [
  "supabase>=2.0",
  "posthog>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
